apiVersion: v1
kind: Secret
metadata:
  name: users-api-secret
  namespace: trading-bot-ns
type: Opaque
stringData:
  username: user
  password: password
  POSTGRES_USER: user
  POSTGRES_PASSWORD: password
  POSTGRES_DB: trading_db
  # Формат: jdbc:postgresql://<ім'я_пода>.<ім'я_headless_сервісу>:<порт>/<бд>
  connection_string: jdbc:postgresql://postgres-headless:5432/trading_db