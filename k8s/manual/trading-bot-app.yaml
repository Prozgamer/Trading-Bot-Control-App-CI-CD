apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trading-bot
  namespace: argocd
spec:
  destination:
    namespace: trading-bot-ns
    server: https://kubernetes.default.svc
  project: default
  source:
    repoURL: registry-1.docker.io/prozgamer
    chart: trading-bot-helm
    targetRevision: 16.00.53  # Версия Хелм-чарта
    helm:
      valueFiles:
        - values.yaml
      # --- ДОБАВЛЯЕМ ЭТОТ БЛОК ПАРАМЕТРОВ ---
      parameters:
        - name: "api.image.tag"
          value: "16.00.53"     # Твой самый свежий тег Docker-образа с кодом!
      # --------------------------------------
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true