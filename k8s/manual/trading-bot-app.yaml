apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trading-bot
  namespace: argocd
spec:
  project: default
  source:
    repoURL: registry-1.docker.io/prozgamer
    chart: trading-bot-helm
    targetRevision: 16.00.54
    helm:
      valueFiles:
        - values.yaml
      # ПЕРЕЗАПИСЫВАЕМ ТЕГ ОБРАЗА:
      parameters:
        - name: image.tag
          value: "16.00.54"
  destination:
    server: https://kubernetes.default.svc
    namespace: trading-bot-ns
  syncPolicy:
    automated:
      prune: true
      selfHeal: true