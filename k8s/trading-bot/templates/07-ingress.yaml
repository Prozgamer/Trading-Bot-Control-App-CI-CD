apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: trading-bot-ingress
  namespace: {{ .Release.Namespace }}
  # Аннотацию можно оставить для совместимости, но главное — поле ниже
spec:
  ingressClassName: traefik  # Добавь эту строку
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: users-api-service
                port:
                  number: 80