apiVersion: v1
kind: Secret
metadata:
  name: users-api-secret
  namespace: {{ .Release.Namespace | default "trading-bot-ns" }}
type: Opaque
stringData:
  username: {{ .Values.database.username | quote }}
  password: {{ .Values.database.password | quote }}
  POSTGRES_USER: {{ .Values.database.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.database.password | quote }}
  POSTGRES_DB: {{ .Values.database.dbName | quote }}
  connection_string: {{ printf "jdbc:postgresql://%s:%d/%s" .Values.database.host (int .Values.database.port) .Values.database.dbName | quote }}