apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-api
  namespace: trading-bot-ns
  labels:
    app: users-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: users-api
  template:
    metadata:
      labels:
        app: users-api
    spec:
      containers:
        - name: users-api
          # Сначала ищет тег в values.yaml (api.image.tag), если нет — берет версию чарта
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag | default .Chart.Version }}"
          # Обязательно Always, чтобы пробить кеш битых образов
          imagePullPolicy: {{ .Values.api.image.pullPolicy | default "Always" }}
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: users-api-secret
                  key: connection_string
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: users-api-secret
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: users-api-secret
                  key: password
            - name: SPRING_JPA_DATABASE_PLATFORM
              value: org.hibernate.dialect.PostgreSQLDialect