version: '3.8'
services:
  db:
    image: postgres:15
    container_name: postgres-db
    environment:
      POSTGRES_DB: trading_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d trading_db"]
      interval: 5s
      timeout: 5s
      retries: 5


  migration-job:
    build: migration-service
    container_name: migration-job
    depends_on:
      db:
        condition: service_healthy
    command:
      - -url=jdbc:postgresql://db:5432/trading_db
      - -user=user
      - -password=password


  users-api:
    image: prozgamer/trading-bot:0.0.1
    container_name: users-api
    ports:
      - "5100:8080"
    environment:
      - APP_VERSION=2.0.1
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/trading_db
      - SPRING_DATASOURCE_USERNAME=user
      - SPRING_DATASOURCE_PASSWORD=password
      - SPRING_FLYWAY_ENABLED=false
    depends_on:
      migration-job:
        condition: service_completed_successfully