trigger:
- main

variables:
  - group: 'my-war-group'
  - name: dockerRepository
    value: 'prozgamer/trading-bot'

stages:
- stage: Build
  displayName: 'Stage 1: Build JAR'
  jobs:
  - job: Compile
    steps:
    - task: JavaToolInstaller@0
      inputs:
        versionSpec: '21'
        jdkArchitectureOption: 'x64'
        jdkSourceOption: 'PreInstalled'

    - task: Maven@3
      inputs:
        mavenPomFile: 'pom.xml'
        goals: 'clean package -DskipTests'
      displayName: 'Maven Package'

    - script: |
        VERSION="1.0.$(Build.BuildId)"
        echo "##vso[task.setvariable variable=outVersion;isOutput=true]$VERSION"
      name: setVarStep 
      displayName: 'Set Output Version Variable'

    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: '$(System.DefaultWorkingDirectory)/target'
        artifact: 'jar-file'

- stage: DockerStage
  displayName: 'Stage 2: Docker Build & Push'
  dependsOn: Build
  variables:
    buildVersion: $[ stageDependencies.Build.Compile.outputs['setVarStep.outVersion'] ]
  jobs:
  - job: DockerJob
    steps:
    - task: DownloadPipelineArtifact@1
      inputs:
        artifactName: 'jar-file'
        targetPath: '$(System.DefaultWorkingDirectory)/target'

    - task: Docker@2
      displayName: 'Build and Push to Docker Hub'
      inputs:
        containerRegistry: 'docker-hub-conn'
        repository: $(dockerRepository)
        command: 'buildAndPush'
        Dockerfile: '**/Dockerfile'
        tags: |
          $(buildVersion)
          latest