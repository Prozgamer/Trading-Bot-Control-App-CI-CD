trigger:
  branches:
    include:
      - main

resources:
  repositories:
    - repository: MyTemplatesRepo
      type: git
      name: TB/PipelineTemplates
    - repository: stateRepo
      type: git
      name: trading-bot-state

variables:
  - group: 'my-war-group'
  - name: dockerRepository
    value: 'prozgamer/trading-bot'
  - name: migrationRepository
    value: 'prozgamer/migration-job'

stages:
  - template: templates/pre-build/v1.yml@MyTemplatesRepo
    parameters:
      dockerUser: $(DOCKER_USER)
      dockerPass: $(DOCKER_PASS)
      dockerRepo: $(dockerRepository)

  - template: templates/build-test/v1.yml@MyTemplatesRepo
    parameters:
      appVersion: "$[ stageDependencies.StageID_PreBuild.JobID_PreBuild.outputs['CalculateAppVersion.APP_VERSION'] ]"

  - template: templates/docker-steps/v1.yml@MyTemplatesRepo
    parameters:
      appVersion: "$[ stageDependencies.StageID_PreBuild.JobID_PreBuild.outputs['CalculateAppVersion.APP_VERSION'] ]"
      dockerRepo: $(dockerRepository)

  - stage: BuildMigration
    displayName: 'Build and Push Migration Image'
    dependsOn: StageID_PreBuild
    variables:
      appVersion: "$[ stageDependencies.StageID_PreBuild.JobID_PreBuild.outputs['CalculateAppVersion.APP_VERSION'] ]"
    jobs:
      - job: BuildMigrationJob
        pool: { vmImage: 'ubuntu-latest' }
        steps:
          - task: Docker@2
            displayName: 'Build and Push Migration'
            inputs:
              containerRegistry: 'docker-hub-conn'
              repository: $(migrationRepository)
              command: 'buildAndPush'
              Dockerfile: 'migration-service/Dockerfile'
              buildContext: 'migration-service'
              tags: |
                $(appVersion)
                latest

  # Этот шаг теперь не упадет, так как мы обновим версию в Chart.yaml заранее
  - template: templates/helm-steps/v1.yml@MyTemplatesRepo
    parameters:
      dockerUser: $(DOCKER_USER)
      dockerPass: $(DOCKER_PASS)
      chartPath: 'k8s/trading-bot'
      ociRegistry: 'registry-1.docker.io/prozgamer'

  - stage: UpdateArgoCD
    displayName: 'Update ArgoCD State'
    dependsOn: StageID_PreBuild
    variables:
      appVersion: "$[ stageDependencies.StageID_PreBuild.JobID_PreBuild.outputs['CalculateAppVersion.APP_VERSION'] ]"
    jobs:
      - job: UpdateManifest
        pool: { vmImage: 'ubuntu-latest' }
        steps:
          # Клонируем оба репозитория
          - checkout: self
            persistCredentials: true
          - checkout: stateRepo
            persistCredentials: true

          - bash: |
              set -e
              
              # 1. Определяем, где мы находимся
              # Обычно $(Pipeline.Workspace)/s - это корень, где лежат все чекауты
              ROOT_DIR="$(Pipeline.Workspace)/s"
              
              # Ищем папку основного бота (там, где лежит Chart.yaml)
              # Ищем по наличию характерного пути внутри
              MAIN_BOT_DIR=$(find $ROOT_DIR -maxdepth 3 -name "Chart.yaml" -exec dirname {} \; | grep "trading-bot" | head -n 1 | xargs dirname | xargs dirname)
              
              # Ищем папку стейт-репозитория (там, где лежит application.yaml)
              STATE_REPO_DIR=$(find $ROOT_DIR -maxdepth 2 -name "application.yaml" -exec dirname {} \; | head -n 1)

              echo "Found Main Bot at: $MAIN_BOT_DIR"
              echo "Found State Repo at: $STATE_REPO_DIR"

              git config --global user.email "devops@azure.com"
              git config --global user.name "Azure DevOps Pipeline"

              # --- ШАГ 1: Обновляем Chart.yaml ---
              cd "$MAIN_BOT_DIR"
              echo "Updating Chart.yaml version to $(appVersion)..."
              sed -i "s/^version: .*/version: $(appVersion)/" k8s/trading-bot/Chart.yaml
              
              git add k8s/trading-bot/Chart.yaml
              # Коммитим, только если есть изменения
              if ! git diff --staged --quiet; then
                git commit -m "Bump Chart version to $(appVersion) [skip ci]"
                git push origin HEAD:main
              else
                echo "No changes in Chart.yaml"
              fi

              # --- ШАГ 2: Обновляем application.yaml ---
              cd "$STATE_REPO_DIR"
              git fetch origin main
              git checkout main

              echo "Updating targetRevision to $(appVersion) in application.yaml..."
              sed -i "s/targetRevision: .*/targetRevision: $(appVersion)/" application.yaml

              git add application.yaml
              if ! git diff --staged --quiet; then
                git commit -m "Update ArgoCD to $(appVersion) [skip ci]"
                git -c http.extraheader="AUTHORIZATION: bearer $(System.AccessToken)" push origin main
              else
                echo "No changes in application.yaml"
              fi
            displayName: 'Final Version Sync'