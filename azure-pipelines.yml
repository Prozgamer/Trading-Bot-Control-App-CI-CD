# Maven
# Build your Java project and run tests with Apache Maven.
# Add steps that analyze code, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/java

trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

steps:
# 1. Скачиваем и настраиваем Java 23 вручную через скрипт
- script: |
    sudo apt-get update
    sudo apt-get install -y openjdk-23-jdk
    echo "##vso[task.setvariable variable=JAVA_HOME]/usr/lib/jvm/java-23-openjdk-amd64"
    echo "##vso[task.prependpath]/usr/lib/jvm/java-23-openjdk-amd64/bin"
  displayName: 'Install OpenJDK 23'

# 2. Собираем проект через Maven
- task: Maven@3
  displayName: 'Maven Build'
  inputs:
    mavenPomFile: 'pom.xml'
    goals: 'clean package -DskipTests'
    # Указываем использовать путь, который мы настроили в скрипте выше
    javaHomeOption: 'Path'
    jdkUserInputPath: '/usr/lib/jvm/java-23-openjdk-amd64'
    publishJUnitResults: true
    testResultsFiles: '**/surefire-reports/TEST-*.xml'

# 3. Сохраняем результат
- task: PublishPipelineArtifact@1
  displayName: 'Save Jar File'
  inputs:
    targetPath: '$(System.DefaultWorkingDirectory)/target'
    artifact: 'MyProjectBuild'
    publishLocation: 'pipeline'