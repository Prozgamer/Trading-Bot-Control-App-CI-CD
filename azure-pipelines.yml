trigger:
- main

resources:
  repositories:
    - repository: MyTemplatesRepo
      type: git
      name: TB/TemplatesRepo

variables:
  - group: 'my-war-group'
  - name: dockerRepository
    value: 'prozgamer/trading-bot'
  - name: calculatedVersion
    value: $[ stageDependencies.StageID_PreBuild.JobID_PreBuild.outputs['CalculateAppVersion.APP_VERSION'] ]

stages:
- template: templates/pre_build/v1.yml@MyTemplatesRepo

- template: templates/build_test/v1.yml@MyTemplatesRepo
  parameters:
    appVersion: $(calculatedVersion)

- template: templates/build_and_push/v1.yml@MyTemplatesRepo
  parameters:
    appVersion: $(calculatedVersion)
    dockerRepo: $(dockerRepository)