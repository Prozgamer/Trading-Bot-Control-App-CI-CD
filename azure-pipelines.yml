trigger:
  branches:
    include:
    - main
    - feature/*

# завдання 2 розрахунок версії
variables:
  - name: buildVersion
    value: '1.0.$(Build.BuildId)' 

stages:
- stage: PreBuild
  displayName: 'Stage 1: Pre-Build'
  jobs:
  - job: EnvironmentSetup
    steps:
    # друкування змінних оточення
    - script: |
        echo "Calculating version for build: $(buildVersion)"
        echo "Full environment list:"
        printenv | sort
      displayName: 'Print Environment Variables'

- stage: BuildAndTest
  displayName: 'Stage 2: Build & Test'
  jobs:
  - job: MavenBuildAndTest
    steps:
    - task: JavaToolInstaller@0
      displayName: 'Install Java 21'
      inputs:
        versionSpec: '21'
        jdkArchitectureOption: 'x64'
        jdkSourceOption: 'PreInstalled'
    
    #Unit Tests
    - task: Maven@3
      displayName: 'Maven Build & Unit Tests'
      inputs:
        mavenPomFile: 'pom.xml'
        goals: 'clean package'
        publishJUnitResults: true
        testResultsFiles: '**/surefire-reports/TEST-*.xml'
        javaHomeOption: 'JDKVersion'
        jdkVersionOption: '1.21'

- stage: PostBuild
  displayName: 'Stage 3: Post-Build'
  #Умова — НЕ запускати для гілок feature/* (тільки для main)
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - job: PublishArtifact
    steps:
    - task: PublishPipelineArtifact@1
      displayName: 'Publish JAR with version'
      inputs:
        targetPath: '$(System.DefaultWorkingDirectory)/target'
        artifact: 'users-api-v$(buildVersion)'
        publishLocation: 'pipeline'