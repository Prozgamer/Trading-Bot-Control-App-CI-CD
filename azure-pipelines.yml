# Maven
# Build your Java project and run tests with Apache Maven.
# Add steps that analyze code, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/java

trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

steps:
- script: |
    sudo apt-get update
    sudo apt-get install -y openjdk-23-jdk
    # Эти две команды делают Java 23 главной в системе
    sudo update-java-alternatives --set java-1.23.0-openjdk-amd64 || true
    export JAVA_HOME=/usr/lib/jvm/java-23-openjdk-amd64
    echo "##vso[task.setvariable variable=JAVA_HOME]$JAVA_HOME"
    echo "##vso[task.prependpath]$JAVA_HOME/bin"
  displayName: 'Install and Set Java 23'

- task: Maven@3
  displayName: 'Maven Build'
  inputs:
    mavenPomFile: 'pom.xml'
    goals: 'clean package -DskipTests'
    javaHomeOption: 'JDKVersion'
    jdkVersionOption: '1.17' 
    publishJUnitResults: true
    testResultsFiles: '**/surefire-reports/TEST-*.xml'

- task: PublishPipelineArtifact@1
  displayName: 'Save Jar File'
  inputs:
    targetPath: '$(System.DefaultWorkingDirectory)/target'
    artifact: 'MyProjectBuild'
    publishLocation: 'pipeline'