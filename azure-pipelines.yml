# Maven
# Build your Java project and run tests with Apache Maven.
# Add steps that analyze code, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/java

trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

steps:
- script: |
    sudo apt-get update
    sudo apt-get install -y openjdk-23-jdk
    JAVA_PATH=$(readlink -f /usr/bin/java | sed "s:/bin/java::")
    echo "##vso[task.setvariable variable=JAVA_HOME]$JAVA_PATH"
  displayName: 'Install OpenJDK 23'


- task: Maven@3
  displayName: 'Maven Build'
  inputs:
    mavenPomFile: 'pom.xml'
    goals: 'clean package -DskipTests'
    javaHomeOption: 'Path'
    jdkUserInputPath: '$(JAVA_HOME)'
    publishJUnitResults: true
    testResultsFiles: '**/surefire-reports/TEST-*.xml'

- task: PublishPipelineArtifact@1
  displayName: 'Save Jar File'
  inputs:
    targetPath: '$(System.DefaultWorkingDirectory)/target'
    artifact: 'MyProjectBuild'
    publishLocation: 'pipeline'