trigger:
- main

resources:
  repositories:
    - repository: MyTemplatesRepo 
      type: git
      name: TB/TemplatesRepo # ВАЖНО: Замени MyProject на имя своего проекта в Azure

variables:
  - group: 'my-war-group'
  - name: dockerRepository
    value: 'prozgamer/trading-bot'
  - name: calculatedVersion
    value: $[ stageDependencies.StageID_PreBuild.JobID_PreBuild.outputs['CalculateAppVersion.APP_VERSION'] ]

stages:
- template: templates/pre-build.yml 
- template: templates/build-test.yml
  parameters:
    appVersion: $(calculatedVersion)

- template: templates/build_and_push/v1/docker-steps.yml@MyTemplatesRepo
  parameters:
    appVersion: $(calculatedVersion)
    dockerRepo: $(dockerRepository)