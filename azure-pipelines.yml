trigger:
  branches:
    include:
      - main

resources:
  repositories:
    - repository: MyTemplatesRepo
      type: git
      name: TB/PipelineTemplates
    - repository: stateRepo
      type: git
      name: trading-bot-state

variables:
  - group: 'my-war-group'
  - name: dockerRepository
    value: 'prozgamer/trading-bot'
  - name: migrationRepository
    value: 'prozgamer/migration-job'

stages:
  # 1. Рассчитываем версию
  - template: templates/pre-build/v1.yml@MyTemplatesRepo
    parameters:
      dockerUser: $(DOCKER_USER)
      dockerPass: $(DOCKER_PASS)
      dockerRepo: $(dockerRepository)

  # 2. Тесты и сборка проекта
  - template: templates/build-test/v1.yml@MyTemplatesRepo
    parameters:
      appVersion: "$[ stageDependencies.StageID_PreBuild.JobID_PreBuild.outputs['CalculateAppVersion.APP_VERSION'] ]"

  # 3. Пуш основного Docker-образа приложения
  - stage: BuildPushDocker
    displayName: 'Docker: Build and Push'
    dependsOn: StageID_PreBuild 
    jobs:
      - job: DockerJob
        pool: { vmImage: 'ubuntu-latest' }
        steps:
          - checkout: self
          - bash: |
              VERSION=$(grep '^version:' k8s/trading-bot/Chart.yaml | awk '{print $2}' | tr -d '"' | tr -d "'")
              echo "##vso[task.setvariable variable=VERSION]$VERSION"
            displayName: 'Extract Version'
          - task: Docker@2
            displayName: 'Build and Push Main App'
            inputs:
              containerRegistry: 'docker-hub-conn'
              repository: $(dockerRepository)
              command: 'buildAndPush'
              tags: |
                $(VERSION)
                latest

  # 4. Сборка и пуш миграций Flyway
  - stage: BuildMigration
    displayName: 'Build and Push Migration Image'
    dependsOn: StageID_PreBuild
    jobs:
      - job: BuildMigrationJob
        pool: { vmImage: 'ubuntu-latest' }
        steps:
          - checkout: self
          - bash: |
              VERSION=$(grep '^version:' k8s/trading-bot/Chart.yaml | awk '{print $2}' | tr -d '"' | tr -d "'")
              echo "##vso[task.setvariable variable=VERSION]$VERSION"
            displayName: 'Extract Version'
          - task: Docker@2
            displayName: 'Build and Push Migration Job'
            inputs:
              containerRegistry: 'docker-hub-conn'
              repository: $(migrationRepository)
              command: 'buildAndPush'
              Dockerfile: 'migration-service/Dockerfile'
              tags: |
                $(VERSION)
                latest

  # 5. Пуш Helm-чарта (OCI подход в выделенный репозиторий Docker Hub)
  - stage: BuildPushHelm
    displayName: 'Helm: Package and Push'
    dependsOn: BuildMigration
    jobs:
      - job: HelmJob
        displayName: 'Package and Push Helm'
        pool: { vmImage: 'ubuntu-latest' }
        steps:
          - checkout: self
          - bash: |
              set -e

              # 1. Считываем имя и версию из Chart.yaml (теперь там имя: trading-bot-helm)
              CHART_NAME=$(grep '^name:' k8s/trading-bot/Chart.yaml | awk '{print $2}' | tr -d '"' | tr -d "'")
              CHART_VERSION=$(grep '^version:' k8s/trading-bot/Chart.yaml | awk '{print $2}' | tr -d '"' | tr -d "'")

              echo "Detected Chart Name: $CHART_NAME"
              echo "Detected Chart Version: $CHART_VERSION"

              # 2. Авторизация в Docker Hub реестре
              echo "$DOCKER_PASS" | helm registry login registry-1.docker.io --username "$DOCKER_USER" --password-stdin

              # 3. Компиляция чарта в .tgz архив
              helm package k8s/trading-bot --version "$CHART_VERSION"

              # 4. Пушим в корень аккаунта. Helm нативно добавит $CHART_NAME (trading-bot-helm) в конец пути URL
              echo "Pushing chart to OCI registry..."
              helm push ${CHART_NAME}-${CHART_VERSION}.tgz oci://registry-1.docker.io/prozgamer
            displayName: 'Handmade Helm Package and Push'
            env:
              DOCKER_USER: $(DOCKER_USER)
              DOCKER_PASS: $(DOCKER_PASS)

  # 6. Финальное обновление манифеста ArgoCD в стейт-репозитории
  - stage: UpdateArgoCD
    displayName: 'Update ArgoCD State'
    dependsOn: 
      - StageID_PreBuild
      - BuildPushHelm 
    variables:
      appVersion: $[ stageDependencies.StageID_PreBuild.JobID_PreBuild.outputs['CalculateAppVersion.APP_VERSION'] ]
    jobs:
      - job: UpdateManifest
        pool: { vmImage: 'ubuntu-latest' }