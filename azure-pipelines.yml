trigger:
  branches:
    include:
      - main
      - feature/*

resources:
  repositories:
    - repository: MyTemplatesRepo
      type: git
      name: TB/PipelineTemplates
    # ДОБАВИЛИ ЭТОТ БЛОК, чтобы пайплайн "видел" репозиторий состояния
    - repository: stateRepo
      type: git
      name: trading-bot-state

variables:
  - group: 'my-war-group'
  - name: dockerRepository
    value: 'prozgamer/trading-bot'
  - name: migrationRepository
    value: 'prozgamer/migration-job'

stages:
  - template: templates/pre-build/v1.yml@MyTemplatesRepo
    parameters:
      dockerUser: $(DOCKER_USER)
      dockerPass: $(DOCKER_PASS)
      dockerRepo: $(dockerRepository)

  - template: templates/build-test/v1.yml@MyTemplatesRepo
    parameters:
      appVersion: "$[ stageDependencies.StageID_PreBuild.JobID_PreBuild.outputs['CalculateAppVersion.APP_VERSION'] ]"

  - template: templates/docker-steps/v1.yml@MyTemplatesRepo
    parameters:
      appVersion: "$[ stageDependencies.StageID_PreBuild.JobID_PreBuild.outputs['CalculateAppVersion.APP_VERSION'] ]"
      dockerRepo: $(dockerRepository)

  - stage: BuildMigration
    displayName: 'Build and Push Migration Image'
    dependsOn: StageID_PreBuild
    variables:
      appVersion: "$[ stageDependencies.StageID_PreBuild.JobID_PreBuild.outputs['CalculateAppVersion.APP_VERSION'] ]"
    jobs:
      - job: BuildMigrationJob
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: Docker@2
            displayName: 'Build and Push Migration Job'
            inputs:
              containerRegistry: 'docker-hub-conn'
              repository: $(migrationRepository)
              command: 'buildAndPush'
              Dockerfile: 'migration-service/Dockerfile'
              buildContext: 'migration-service'
              tags: |
                $(appVersion)
                latest

  - template: templates/helm-steps/v1.yml@MyTemplatesRepo
    parameters:
      dockerUser: $(DOCKER_USER)
      dockerPass: $(DOCKER_PASS)
      chartPath: 'k8s/trading-bot'
      ociRegistry: 'registry-1.docker.io/prozgamer'

  - stage: UpdateArgoCD
    displayName: 'Update ArgoCD State'
    jobs:
      - job: UpdateManifest
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self
            persistCredentials: true
          # ДОПОЛНИТЕЛЬНО чекаутим репозиторий состояния, чтобы права точно подхватились
          - checkout: stateRepo
            persistCredentials: true

          - bash: |
              set -e
              # 1. Возвращаемся в папку основного проекта, чтобы прочитать версию
              cd $(Build.SourcesDirectory)/Main\ Bot
              CHART_VERSION=$(grep '^version:' k8s/trading-bot/Chart.yaml | awk '{print $2}' | tr -d '"' | tr -d "'")
              echo "Detected Chart Version: $CHART_VERSION"

              # 2. Настройка Git
              git config --global user.email "devops@azure.com"
              git config --global user.name "Azure DevOps Pipeline"

              # 3. Переходим в папку репозитория состояния (он уже скачан чекаутом)
              cd $(Build.SourcesDirectory)/trading-bot-state

              # 4. Обновление версии
              echo "Updating targetRevision to $CHART_VERSION"
              sed -i "s/targetRevision: .*/targetRevision: $CHART_VERSION/" application.yaml

              # 5. Пуш (теперь через системный токен, который видит оба репо)
              git add application.yaml
              
              if git diff --staged --quiet; then
                echo "No changes to commit."
              else
                git commit -m "Update ArgoCD to version $CHART_VERSION [skip ci]"
                # Используем встроенный токен авторизации
                git -c http.extraheader="AUTHORIZATION: bearer $(System.AccessToken)" push origin main
              fi
            displayName: 'Update targetRevision in State Repo'