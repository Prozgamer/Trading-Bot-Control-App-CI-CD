trigger:
  branches:
    include:
    - main
    - feature/*

# зчитуємо версію
variables:
  - group: 'my-war-group' 
  - name: buildVersion
    value: '1.0.$(Build.BuildId)' 

stages:
- stage: PreBuild
  displayName: 'Stage 1: Pre-Build'
  jobs:
  - job: EnvironmentSetup
    steps:
    - script: |
        echo "Project Name from Library: $(MY_PROJECT_NAME)"
        echo "Calculated Version: $(buildVersion)"
        printenv | sort
      displayName: 'Print Variables and Environment'

- stage: BuildAndPublish
  displayName: 'Stage 2 & 3: Build, Test & Publish'
  jobs:
  - job: MainJob
    steps:
    - task: JavaToolInstaller@0
      displayName: 'Install Java 21'
      inputs:
        versionSpec: '21'
        jdkArchitectureOption: 'x64'
        jdkSourceOption: 'PreInstalled'
    
    # Збірка і тести
    - task: Maven@3
      displayName: 'Maven Build & Unit Tests'
      inputs:
        mavenPomFile: 'pom.xml'
        goals: 'clean package'
        publishJUnitResults: true
        testResultsFiles: '**/surefire-reports/TEST-*.xml'
        javaHomeOption: 'JDKVersion'
        jdkVersionOption: '1.21'

    # Публикація артефакту
    - task: PublishPipelineArtifact@1
      displayName: 'Publish JAR'
      condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
      inputs:
        targetPath: '$(System.DefaultWorkingDirectory)/target'
        artifact: 'users-api-v$(buildVersion)'
        publishLocation: 'pipeline'