parameters:
- name: appVersion
  type: string
- name: dockerRepo
  type: string

stages:
- stage: StageID_BuildAndPushDockerImage
  displayName: 'Docker Build and Push'
  dependsOn: 
    - StageID_PreBuild
    - StageID_BuildAndTestProject
  jobs:
  - job: JobID_BuildAndPushDockerImage
    steps:
    - task: Docker@2
      inputs:
        containerRegistry: 'docker-hub-conn'
        repository: ${{ parameters.dockerRepo }}
        command: 'buildAndPush'
        tags: |
          ${{ parameters.appVersion }}
          latest