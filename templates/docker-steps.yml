parameters:
- name: appVersion
  type: string
- name: dockerRepo
  type: string

stages:
- stage: StageID_BuildAndPushDockerImage
  displayName: 'Docker: Build and Push (Template)'
  dependsOn: 
    - StageID_PreBuild
    - StageID_BuildAndTestProject
  variables:
    v_Version: ${{ parameters.appVersion }}
  jobs:
  - job: JobID_BuildAndPushDockerImage
    steps:
    - task: Docker@2
      displayName: 'Build and Push'
      inputs:
        containerRegistry: 'docker-hub-conn'
        repository: ${{ parameters.dockerRepo }}
        command: 'buildAndPush'
        Dockerfile: '**/Dockerfile'
        tags: |
          $(v_Version)
          latest