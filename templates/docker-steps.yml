parameters:
- name: appVersion
  type: string
- name: dockerRepo
  type: string

stages:
- stage: StageID_BuildAndPushDockerImage
  displayName: 'Docker: Build and Push (Template)'
  dependsOn: 
    - StageID_PreBuild
    - StageID_BuildAndTestProject
  condition: and(succeeded(), eq(variables['Build.SourceBranchName'], 'main'))
  jobs:
  - job: JobID_BuildAndPushDockerImage
    steps:
    - task: Docker@2
      displayName: 'Build and Push'
      inputs:
        containerRegistry: 'docker-hub-conn' # Твое имя Service Connection
        repository: ${{ parameters.dockerRepo }}
        command: 'buildAndPush'
        Dockerfile: '**/Dockerfile'
        tags: |
          ${{ parameters.appVersion }}
          latest